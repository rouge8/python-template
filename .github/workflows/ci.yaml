---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - run: gh extension install github/gh-actions-lock
      - uses: actions/setup-python@v7.1.0
      - uses: j178/prek-action@v3.1.0

  tox:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    env:
      TOXENV: ${{ matrix.toxenv }}

    strategy:
      fail-fast: false
      matrix:
        toxenv:
          - py,test-coverage
          - pyrefly

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: pyproject.toml
      - name: Generate the cache suffix
        id: cache-suffix
        run: |
          echo cache-suffix=${TOXENV//,/-} >> $GITHUB_OUTPUT
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-suffix: ${{ steps.cache-suffix.outputs.cache-suffix }}
      - name: tox
        run: uvx tox
